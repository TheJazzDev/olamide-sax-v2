  <path d="M24 12 C24 24 40 26 40 36 C40 46 26 46 26 52"
        fill="none" stroke="#B8863B" stroke-width="3.4"
        stroke-linecap="round"/>
  <!-- key-light points -->
  <circle cx="40" cy="30" r="1.9" fill="#D8B87E"/>
  <circle cx="39" cy="37" r="1.9" fill="#D8B87E"/>
  <circle cx="35" cy="43" r="1.9" fill="#D8B87E"/>
</svg>
