<!-- ============================================================================
     nav.html — Olamide Sax V2 · CANONICAL nav partial
     No build step: this markup is duplicated byte-identical into every page,
     placed as the first child inside <body>, directly after the .frame /
     .grain / .stage-bloom decorative layers and before <main>.

     The film-frame already carries the wordmark in its top-left corner, so
     this bar stays collapsed/minimal: a small secondary wordmark (kept for
     a11y + pages where the frame corner may be visually crowded) and a
     single "Menu" trigger that opens the full-screen overlay. No link
     clutter in the bar itself — IA lives inside the overlay.

     Contract (do not rename — later tasks depend on these exact hooks):
       .site-nav               fixed bar, top
       .site-nav__wordmark      small wordmark link → index.html
       .nav-toggle              the Menu trigger (aria-controls, aria-expanded)
       .menu-overlay            full-screen overlay panel
       .menu-overlay[data-open] attribute reflects open state (no class toggle)
     ========================================================================== -->

<nav class="site-nav" aria-label="Primary">
  <a class="site-nav__wordmark" href="/index.html">
    <span class="site-nav__wordmark-text">Olamide<span class="site-nav__wordmark-accent">Sax</span></span>
  </a>

  <button
    type="button"
    class="nav-toggle"
    id="nav-toggle"
    aria-haspopup="dialog"
    aria-expanded="false"
    aria-controls="menu-overlay"
    aria-label="Open menu"
  >
    <span class="nav-toggle__label label">Menu</span>
    <span class="nav-toggle__glyph" aria-hidden="true">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </span>
  </button>
</nav>
